name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run install:browsers
      - run: npm run typecheck
      - run: npm run verify:site-sandbox-manifest
      - run: npm run verify:release-evidence
      - run: npm run verify:deployment-config
      - run: npm run verify:authoring
      - run: npm run verify:health
      - run: npm run verify:site-sandbox-local
      - run: npm run verify:render-browser
