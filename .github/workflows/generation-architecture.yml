name: Generation architecture

on:
  pull_request:
  push:
    branches: [main]

jobs:
  canonical-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run install:browsers
      - run: npm run typecheck
      - run: npm run verify:evidence-ledger
      - run: npm run verify:canonical-generation
      - run: npm run verify:canonical-render-browser
      - run: npm run verify:generation-architecture
