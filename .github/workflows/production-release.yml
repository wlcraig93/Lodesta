name: Production release

on:
  workflow_run:
    workflows: ["Continuous integration"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_run'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_WEB_SERVICE_ID: ${{ vars.RAILWAY_WEB_SERVICE_ID }}
      RAILWAY_WORKER_SERVICE_ID: ${{ vars.RAILWAY_WORKER_SERVICE_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LODESTA_APP_ORIGIN: ${{ vars.LODESTA_APP_ORIGIN }}
      LODESTA_ADMIN_TOKEN: ${{ secrets.LODESTA_ADMIN_TOKEN }}
      LODESTA_EXECUTION_ROLE: release
      LODESTA_MAINTENANCE_LEASE_OWNER: ${{ secrets.LODESTA_MAINTENANCE_LEASE_OWNER }}
      EVIDENCE_DIR: .data/release-evidence
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      LODESTA_RELEASE_GIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/site-sandbox/scaffold/package-lock.json
      - run: npm ci
      - run: npm run install:browsers
      - run: npm ci --prefix workers/site-sandbox/scaffold --ignore-scripts --no-audit --no-fund
      - run: npm install --global @railway/cli@5.28.1

      - name: Verify Cloudflare deployment authority
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          npx wrangler whoami > "$EVIDENCE_DIR/cloudflare-identity.txt"
          npx wrangler r2 bucket list > "$EVIDENCE_DIR/cloudflare-r2-access.txt"

      - name: Verify exact release and authority matrix
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          NODE_ENV=production npm run verify:execution-authority
          NODE_ENV=production node --import tsx --input-type=module -e '
            import { strict as assert } from "node:assert";
            import { hasHostedExecutionAuthority } from "./packages/execution-environment.ts";
            assert.equal(hasHostedExecutionAuthority("release"), true);
            assert.equal(hasHostedExecutionAuthority("site-authoring-worker"), false);
          '

      - name: Verify full preflight for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -Eeuo pipefail
          LODESTA_REPOSITORY=local npm run verify:preflight

      - name: Capture current controller identities
        run: |
          set -Eeuo pipefail
          railway deployment list --environment "$RAILWAY_ENVIRONMENT_ID" --service "$RAILWAY_WEB_SERVICE_ID" \
            --limit 20 --json > "$EVIDENCE_DIR/railway-web-before.json"
          railway deployment list --environment "$RAILWAY_ENVIRONMENT_ID" --service "$RAILWAY_WORKER_SERVICE_ID" \
            --limit 20 --json > "$EVIDENCE_DIR/railway-worker-before.json"
          railway status --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --json \
            > "$EVIDENCE_DIR/railway-status-before.json"
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const status = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const environment = status.environments.edges.map((edge) => edge.node).find((item) => item.id === process.env.RAILWAY_ENVIRONMENT_ID);
            const instances = environment?.serviceInstances.edges.map((edge) => edge.node) ?? [];
            const active = (serviceId) => instances.find((instance) => instance.serviceId === serviceId)
              ?.activeDeployments.find((deployment) => !deployment.deploymentStopped);
            const web = active(process.env.RAILWAY_WEB_SERVICE_ID);
            const worker = active(process.env.RAILWAY_WORKER_SERVICE_ID);
            if (!web?.id) throw new Error("A prior Railway web deployment is required.");
            writeFileSync(process.argv[2], JSON.stringify({
              candidateReleaseSha: process.env.RELEASE_SHA,
              previousWebReleaseSha: web.meta?.commitHash ?? null,
              previousWorkerReleaseSha: worker?.meta?.commitHash ?? null,
              workerBootstrap: !worker?.id,
              web,
              worker: worker ?? null
            }, null, 2));
          ' "$EVIDENCE_DIR/railway-status-before.json" "$EVIDENCE_DIR/controller-identities-before.json"

      - name: Acquire or renew the database maintenance fence and drain
        run: |
          set -Eeuo pipefail
          if NODE_ENV=production LODESTA_REPOSITORY=supabase npm run --silent maintenance:site-authoring -- renew --minutes=90 \
            > "$EVIDENCE_DIR/maintenance-renew.json" 2> "$EVIDENCE_DIR/maintenance-renew-error.txt"; then
            :
          else
            NODE_ENV=production LODESTA_REPOSITORY=supabase npm run --silent maintenance:site-authoring -- acquire --minutes=90 --draining \
              > "$EVIDENCE_DIR/maintenance-acquire.json"
          fi
          if ! NODE_ENV=production LODESTA_REPOSITORY=supabase npm run --silent maintenance:site-authoring -- wait-active --timeout-minutes=30 \
            > "$EVIDENCE_DIR/maintenance-drain.json"; then
            node --input-type=module -e '
              import { writeFileSync } from "node:fs";
              writeFileSync(process.argv[1], JSON.stringify({ ok: false, outcome: "authoring_drain_timeout" }, null, 2));
            ' "$EVIDENCE_DIR/authoring-drain-timeout.json"
            NODE_ENV=production LODESTA_REPOSITORY=supabase npm run --silent maintenance:site-authoring -- release \
              > "$EVIDENCE_DIR/maintenance-release-after-drain-timeout.json"
            exit 1
          fi
          touch "$EVIDENCE_DIR/maintenance-active"

      - name: Deploy web and worker from the same release
        id: controllers
        run: |
          set -Eeuo pipefail
          for pair in "$RAILWAY_WEB_SERVICE_ID:web" "$RAILWAY_WORKER_SERVICE_ID:site-authoring-worker"; do
            service="${pair%%:*}"
            role="${pair#*:}"
            railway variable set "LODESTA_RELEASE_GIT_SHA=$RELEASE_SHA" "LODESTA_EXECUTION_ROLE=$role" "LODESTA_REPOSITORY=supabase" --skip-deploys \
              --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --service "$service" > /dev/null
          done
          railway up --detach --json --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_WEB_SERVICE_ID" --message "Production web $RELEASE_SHA" \
            > "$EVIDENCE_DIR/railway-web-submit.json"
          railway up --detach --json --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_WORKER_SERVICE_ID" --message "Production worker $RELEASE_SHA" \
            > "$EVIDENCE_DIR/railway-worker-submit.json"
          # Railway's control plane can transiently time out while a healthy
          # deployment continues. Poll both already-submitted services within one
          # aggregate bound, and distinguish an unavailable status query from an
          # actual terminal deployment status.
          for attempt in $(seq 1 90); do
            all_succeeded=true
            for spec in "web:$RAILWAY_WEB_SERVICE_ID" "worker:$RAILWAY_WORKER_SERVICE_ID"; do
              name="${spec%%:*}"
              service="${spec#*:}"
              [ -f "$EVIDENCE_DIR/railway-$name-succeeded" ] && continue
              candidates="$EVIDENCE_DIR/railway-$name-candidates.json"
              candidate_tmp="$candidates.tmp"
              if timeout --kill-after=5s 10s railway deployment list --environment "$RAILWAY_ENVIRONMENT_ID" --service "$service" \
                --limit 20 --json > "$candidate_tmp" 2>> "$EVIDENCE_DIR/railway-$name-poll-errors.log"; then
                mv "$candidate_tmp" "$candidates"
              else
                poll_status=$?
                rm -f "$candidate_tmp"
                printf '{"attempt":%s,"outcome":"railway_control_plane_unavailable","status":%s}\n' \
                  "$attempt" "$poll_status" >> "$EVIDENCE_DIR/railway-$name-poll-events.jsonl"
                all_succeeded=false
                continue
              fi
              status="$(node --input-type=module -e '
                import { readFileSync, writeFileSync } from "node:fs";
                const priorIds = new Set(JSON.parse(readFileSync(process.argv[1], "utf8")).map((deployment) => deployment.id));
                const candidate = JSON.parse(readFileSync(process.argv[2], "utf8")).find((deployment) => !priorIds.has(deployment.id));
                if (candidate) writeFileSync(process.argv[3], JSON.stringify([candidate], null, 2));
                process.stdout.write(candidate?.status ?? "PENDING");
              ' "$EVIDENCE_DIR/railway-$name-before.json" "$candidates" "$EVIDENCE_DIR/railway-$name.json")"
              case "$status" in
                SUCCESS) touch "$EVIDENCE_DIR/railway-$name-succeeded";;
                FAILED|CRASHED|CANCELLED|CANCELED) exit 1;;
                *) all_succeeded=false;;
              esac
            done
            [ "$all_succeeded" = true ] && break
            [ "$attempt" -eq 90 ] && exit 1
            sleep 20
          done
          rm -f "$EVIDENCE_DIR/railway-web-succeeded" "$EVIDENCE_DIR/railway-worker-succeeded"
          web_deployment="$(node -p "JSON.parse(require('fs').readFileSync('$EVIDENCE_DIR/railway-web.json'))[0].id")"
          worker_deployment="$(node -p "JSON.parse(require('fs').readFileSync('$EVIDENCE_DIR/railway-worker.json'))[0].id")"
          echo "web_deployment=$web_deployment" >> "$GITHUB_OUTPUT"
          echo "worker_deployment=$worker_deployment" >> "$GITHUB_OUTPUT"

      - name: Verify both controller identities
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --header "authorization: Bearer $LODESTA_ADMIN_TOKEN" \
              "$LODESTA_APP_ORIGIN/api/health/?identity=1" > "$EVIDENCE_DIR/pre-promotion-identity.json"; then
              node --input-type=module -e '
                import { readFileSync } from "node:fs";
                const report = JSON.parse(readFileSync(process.argv[1], "utf8"));
                const identity = report.checks?.find((check) => check.id === "release_identity");
                if (report.status === "error" || identity?.detail !== process.env.RELEASE_SHA) process.exit(1);
              ' "$EVIDENCE_DIR/pre-promotion-identity.json" && break
            fi
            [ "$attempt" -eq 30 ] && exit 1
            sleep 10
          done
          for attempt in $(seq 1 30); do
            if timeout --kill-after=5s 15s railway logs "${{ steps.controllers.outputs.worker_deployment }}" --service "$RAILWAY_WORKER_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --project "$RAILWAY_PROJECT_ID" --lines 200 --json \
              > "$EVIDENCE_DIR/railway-worker-startup.jsonl.tmp" \
              2>> "$EVIDENCE_DIR/railway-worker-log-errors.log"; then
              mv "$EVIDENCE_DIR/railway-worker-startup.jsonl.tmp" "$EVIDENCE_DIR/railway-worker-startup.jsonl"
            else
              log_status=$?
              rm -f "$EVIDENCE_DIR/railway-worker-startup.jsonl.tmp"
              printf '{"attempt":%s,"outcome":"railway_control_plane_unavailable","status":%s}\n' \
                "$attempt" "$log_status" >> "$EVIDENCE_DIR/railway-worker-log-events.jsonl"
            fi
            if [ -f "$EVIDENCE_DIR/railway-worker-startup.jsonl" ] \
              && grep -q 'worker_started' "$EVIDENCE_DIR/railway-worker-startup.jsonl" \
              && grep -q "$RELEASE_SHA" "$EVIDENCE_DIR/railway-worker-startup.jsonl"; then
              break
            fi
            [ "$attempt" -eq 30 ] && exit 1
            sleep 10
          done

      - name: Run deep health
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --header "authorization: Bearer $LODESTA_ADMIN_TOKEN" \
              "$LODESTA_APP_ORIGIN/api/health/?deep=1" > "$EVIDENCE_DIR/post-deploy-health.json"; then
              node --input-type=module -e '
                import { readFileSync } from "node:fs";
                const report = JSON.parse(readFileSync(process.argv[1], "utf8"));
                const identity = report.checks?.find((check) => check.id === "release_identity");
                if (report.status === "error" || identity?.detail !== process.env.RELEASE_SHA) process.exit(1);
              ' "$EVIDENCE_DIR/post-deploy-health.json" && exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Release maintenance after successful health
        if: success()
        run: |
          set -Eeuo pipefail
          NODE_ENV=production LODESTA_REPOSITORY=supabase npm run --silent maintenance:site-authoring -- release \
            > "$EVIDENCE_DIR/maintenance-release.json"
          rm -f "$EVIDENCE_DIR/maintenance-active"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ env.RELEASE_SHA }}-${{ github.run_attempt }}
          path: .data/release-evidence/
          if-no-files-found: error
          retention-days: 90
