name: Production release

on:
  workflow_run:
    workflows: ["Continuous integration"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      LODESTA_SANDBOX_BLUE_URL: ${{ vars.LODESTA_SANDBOX_BLUE_URL }}
      LODESTA_SANDBOX_BLUE_TOKEN: ${{ secrets.LODESTA_SANDBOX_BLUE_TOKEN }}
      LODESTA_SANDBOX_GREEN_URL: ${{ vars.LODESTA_SANDBOX_GREEN_URL }}
      LODESTA_SANDBOX_GREEN_TOKEN: ${{ secrets.LODESTA_SANDBOX_GREEN_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LODESTA_APP_ORIGIN: ${{ vars.LODESTA_APP_ORIGIN }}
      LODESTA_ADMIN_TOKEN: ${{ secrets.LODESTA_ADMIN_TOKEN }}
      EVIDENCE_DIR: .data/release-evidence
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/site-sandbox/scaffold/package-lock.json
      - run: npm ci
      - run: npm run install:browsers
      - run: npm ci --prefix workers/site-sandbox/scaffold --ignore-scripts --no-audit --no-fund
      - run: npm install --global @railway/cli@5.28.1

      - name: Verify exact release
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          mkdir -p "$EVIDENCE_DIR"
          npm run verify:preflight

      - name: Select an inactive drained slot
        id: slot
        run: |
          set -Eeuo pipefail
          npm run sandbox:deployments -- status > "$EVIDENCE_DIR/sandbox-control-before.json"
          inactive="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const status = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (!status.configured) throw new Error("Run the reviewed one-time blue-green cutover first.");
            const active = status.control.activeDeploymentId;
            process.stdout.write(status.control.blueDeploymentId === active ? "green" : "blue");
          ' "$EVIDENCE_DIR/sandbox-control-before.json")"
          previous="$(node -p "JSON.parse(require('fs').readFileSync('$EVIDENCE_DIR/sandbox-control-before.json')).control.activeDeploymentId")"
          npm run sandbox:deployments -- assert-slot-available --slot "$inactive"
          echo "slot=$inactive" >> "$GITHUB_OUTPUT"
          echo "previous_deployment=$previous" >> "$GITHUB_OUTPUT"

      - name: Deploy and canary the inactive slot
        id: sandbox
        run: |
          set -Eeuo pipefail
          slot="${{ steps.slot.outputs.slot }}"
          config="workers/site-sandbox/wrangler.$slot.jsonc"
          npx wrangler deploy --config "$config" --strict --containers-rollout=immediate \
            --tag "$RELEASE_SHA" --message "Blue-green candidate $RELEASE_SHA" \
            2>&1 | tee "$EVIDENCE_DIR/sandbox-deploy.log"
          node --import tsx scripts/release-evidence.ts deployed-cloudflare \
            "$EVIDENCE_DIR/sandbox-deploy.log" > "$EVIDENCE_DIR/sandbox-deployment.json"
          version="$(node -p "JSON.parse(require('fs').readFileSync('$EVIDENCE_DIR/sandbox-deployment.json')).versionId")"
          digest="$(node -p "JSON.parse(require('fs').readFileSync('$EVIDENCE_DIR/sandbox-deployment.json')).imageDigest")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          LODESTA_SANDBOX_CANARY_SLOT="$slot" npm run verify:site-sandbox-deployed \
            > "$EVIDENCE_DIR/sandbox-canary.json"
          npm run sandbox:deployments -- register \
            --slot "$slot" --worker-version "$version" --release-sha "$RELEASE_SHA" \
            --image-digest "$digest" > "$EVIDENCE_DIR/sandbox-registration.json"
          deployment="$(node -p "JSON.parse(require('fs').readFileSync('$EVIDENCE_DIR/sandbox-registration.json')).deployment.id")"
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"

      - name: Deploy the dual-slot controller
        run: |
          set -Eeuo pipefail
          railway variable set "LODESTA_RELEASE_GIT_SHA=$RELEASE_SHA" --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --service "$RAILWAY_SERVICE_ID" > /dev/null
          railway up --ci --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" --message "Production release $RELEASE_SHA"
          for attempt in $(seq 1 90); do
            railway deployment list --environment "$RAILWAY_ENVIRONMENT_ID" --service "$RAILWAY_SERVICE_ID" \
              --limit 1 --json > "$EVIDENCE_DIR/railway.json"
            status="$(node -p "JSON.parse(require('fs').readFileSync('$EVIDENCE_DIR/railway.json'))[0]?.status ?? 'UNKNOWN'")"
            [ "$status" = "SUCCESS" ] && break
            case "$status" in FAILED|CRASHED|CANCELLED|CANCELED) exit 1;; esac
            [ "$attempt" -eq 90 ] && exit 1
            sleep 20
          done
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error --header "authorization: Bearer $LODESTA_ADMIN_TOKEN" \
              "$LODESTA_APP_ORIGIN/api/health?deep=1" > "$EVIDENCE_DIR/pre-promotion-health.json" && break
            [ "$attempt" -eq 30 ] && exit 1
            sleep 10
          done

      - name: Atomically promote the candidate deployment
        id: promotion
        run: |
          set -Eeuo pipefail
          npm run sandbox:deployments -- promote --deployment-id "${{ steps.sandbox.outputs.deployment }}" \
            > "$EVIDENCE_DIR/sandbox-promotion.json"
          touch "$EVIDENCE_DIR/promoted"
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error --header "authorization: Bearer $LODESTA_ADMIN_TOKEN" \
              "$LODESTA_APP_ORIGIN/api/health?deep=1" > "$EVIDENCE_DIR/post-promotion-health.json" && exit 0
            sleep 10
          done
          exit 1

      - name: Roll back the pointer if post-promotion verification fails
        if: failure() && steps.promotion.outcome == 'failure'
        run: |
          set -Eeuo pipefail
          [ -f "$EVIDENCE_DIR/promoted" ] || exit 0
          npm run sandbox:deployments -- rollback --deployment-id "${{ steps.slot.outputs.previous_deployment }}" \
            > "$EVIDENCE_DIR/automatic-sandbox-rollback.json"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ env.RELEASE_SHA }}-${{ github.run_attempt }}
          path: .data/release-evidence/
          if-no-files-found: error
          retention-days: 90
