name: Production release

on:
  workflow_run:
    workflows: ["Continuous integration"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      LODESTA_SANDBOX_BLUE_URL: ${{ vars.LODESTA_SANDBOX_BLUE_URL }}
      LODESTA_SANDBOX_BLUE_TOKEN: ${{ secrets.LODESTA_SANDBOX_BLUE_TOKEN }}
      LODESTA_SANDBOX_GREEN_URL: ${{ vars.LODESTA_SANDBOX_GREEN_URL }}
      LODESTA_SANDBOX_GREEN_TOKEN: ${{ secrets.LODESTA_SANDBOX_GREEN_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_WEB_SERVICE_ID: ${{ vars.RAILWAY_WEB_SERVICE_ID }}
      RAILWAY_WORKER_SERVICE_ID: ${{ vars.RAILWAY_WORKER_SERVICE_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LODESTA_APP_ORIGIN: ${{ vars.LODESTA_APP_ORIGIN }}
      LODESTA_ADMIN_TOKEN: ${{ secrets.LODESTA_ADMIN_TOKEN }}
      LODESTA_EXECUTION_ROLE: release
      LODESTA_MAINTENANCE_LEASE_OWNER: ${{ secrets.LODESTA_MAINTENANCE_LEASE_OWNER }}
      EVIDENCE_DIR: .data/release-evidence
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      LODESTA_RELEASE_GIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/site-sandbox/scaffold/package-lock.json
      - run: npm ci
      - run: npm run install:browsers
      - run: npm ci --prefix workers/site-sandbox/scaffold --ignore-scripts --no-audit --no-fund
      - run: npm install --global @railway/cli@5.28.1

      - name: Verify Cloudflare deployment authority
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          npx wrangler whoami > "$EVIDENCE_DIR/cloudflare-identity.txt"
          npx wrangler r2 bucket list > "$EVIDENCE_DIR/cloudflare-r2-access.txt"

      - name: Verify exact release and authority matrix
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          NODE_ENV=production npm run verify:execution-authority
          NODE_ENV=production node --import tsx --input-type=module -e '
            import { strict as assert } from "node:assert";
            import { hasHostedExecutionAuthority } from "./packages/execution-environment.ts";
            assert.equal(hasHostedExecutionAuthority("release"), true);
            assert.equal(hasHostedExecutionAuthority("site-authoring-worker"), false);
          '
          LODESTA_REPOSITORY=local npm run verify:preflight

      - name: Select an inactive drained slot
        id: slot
        run: |
          set -Eeuo pipefail
          LODESTA_REPOSITORY=supabase npm run --silent sandbox:deployments -- status > "$EVIDENCE_DIR/sandbox-control-before.json"
          inactive="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const status = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (!status.configured) throw new Error("Run the reviewed one-time blue-green cutover first.");
            const active = status.control.activeDeploymentId;
            process.stdout.write(status.control.blueDeploymentId === active ? "green" : "blue");
          ' "$EVIDENCE_DIR/sandbox-control-before.json")"
          previous="$(node -p "JSON.parse(require('fs').readFileSync('$EVIDENCE_DIR/sandbox-control-before.json')).control.activeDeploymentId")"
          LODESTA_REPOSITORY=supabase npm run --silent sandbox:deployments -- assert-slot-available --slot "$inactive"
          echo "slot=$inactive" >> "$GITHUB_OUTPUT"
          echo "previous_deployment=$previous" >> "$GITHUB_OUTPUT"

      - name: Deploy, canary, and register the inactive sandbox
        id: sandbox
        run: |
          set -Eeuo pipefail
          slot="${{ steps.slot.outputs.slot }}"
          config="workers/site-sandbox/wrangler.$slot.jsonc"
          npx wrangler deploy --config "$config" --strict --containers-rollout=immediate \
            --tag "$RELEASE_SHA" --message "Blue-green candidate $RELEASE_SHA" \
            2>&1 | tee "$EVIDENCE_DIR/sandbox-deploy.log"
          node --import tsx scripts/release-evidence.ts deployed-cloudflare \
            "$EVIDENCE_DIR/sandbox-deploy.log" > "$EVIDENCE_DIR/sandbox-deployment.json"
          version="$(node -p "JSON.parse(require('fs').readFileSync('$EVIDENCE_DIR/sandbox-deployment.json')).versionId")"
          digest="$(node -p "JSON.parse(require('fs').readFileSync('$EVIDENCE_DIR/sandbox-deployment.json')).imageDigest")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          canary_session="sandbox_verify_${RELEASE_SHA:0:12}_${slot}"
          # Wrangler returns after the application update is accepted, before
          # every new Durable Object connection is guaranteed to resolve to the
          # replacement container image. Keep this wait outside maintenance so
          # rollout propagation cannot lengthen the authoring blackout.
          container_readiness_delay_seconds=90
          sleep "$container_readiness_delay_seconds"
          if ! LODESTA_SANDBOX_CANARY_SLOT="$slot" LODESTA_SANDBOX_CANARY_SESSION_ID="$canary_session" npm run verify:site-sandbox-deployed \
            > "$EVIDENCE_DIR/sandbox-canary-attempt-1.json" \
            2> "$EVIDENCE_DIR/sandbox-canary-attempt-1.error.log"; then
            # Cloudflare may accept the Worker version before the new container
            # application has finished replacing its runtime connections. Keep the
            # first failure as evidence, then retry the complete canary exactly once
            # against the same immutable deployment after a bounded readiness delay.
            sleep "$container_readiness_delay_seconds"
            LODESTA_SANDBOX_CANARY_SLOT="$slot" LODESTA_SANDBOX_CANARY_SESSION_ID="$canary_session" npm run verify:site-sandbox-deployed \
              > "$EVIDENCE_DIR/sandbox-canary-attempt-2.json" \
              2> "$EVIDENCE_DIR/sandbox-canary-attempt-2.error.log"
            cp "$EVIDENCE_DIR/sandbox-canary-attempt-2.json" "$EVIDENCE_DIR/sandbox-canary.json"
          else
            cp "$EVIDENCE_DIR/sandbox-canary-attempt-1.json" "$EVIDENCE_DIR/sandbox-canary.json"
          fi
          NODE_ENV=production LODESTA_REPOSITORY=supabase npm run --silent sandbox:deployments -- register \
            --slot "$slot" --worker-version "$version" --release-sha "$RELEASE_SHA" \
            --image-digest "$digest" > "$EVIDENCE_DIR/sandbox-registration.json"
          deployment="$(node -p "JSON.parse(require('fs').readFileSync('$EVIDENCE_DIR/sandbox-registration.json')).deployment.id")"
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"

      - name: Capture current controller identities
        run: |
          set -Eeuo pipefail
          railway deployment list --environment "$RAILWAY_ENVIRONMENT_ID" --service "$RAILWAY_WEB_SERVICE_ID" \
            --limit 20 --json > "$EVIDENCE_DIR/railway-web-before.json"
          railway deployment list --environment "$RAILWAY_ENVIRONMENT_ID" --service "$RAILWAY_WORKER_SERVICE_ID" \
            --limit 20 --json > "$EVIDENCE_DIR/railway-worker-before.json"
          railway status --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --json \
            > "$EVIDENCE_DIR/railway-status-before.json"
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const status = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const environment = status.environments.edges.map((edge) => edge.node).find((item) => item.id === process.env.RAILWAY_ENVIRONMENT_ID);
            const instances = environment?.serviceInstances.edges.map((edge) => edge.node) ?? [];
            const active = (serviceId) => instances.find((instance) => instance.serviceId === serviceId)
              ?.activeDeployments.find((deployment) => !deployment.deploymentStopped);
            const web = active(process.env.RAILWAY_WEB_SERVICE_ID);
            const worker = active(process.env.RAILWAY_WORKER_SERVICE_ID);
            if (!web?.id) throw new Error("A prior Railway web deployment is required.");
            writeFileSync(process.argv[2], JSON.stringify({
              candidateReleaseSha: process.env.RELEASE_SHA,
              previousWebReleaseSha: web.meta?.commitHash ?? null,
              previousWorkerReleaseSha: worker?.meta?.commitHash ?? null,
              workerBootstrap: !worker?.id,
              web,
              worker: worker ?? null
            }, null, 2));
          ' "$EVIDENCE_DIR/railway-status-before.json" "$EVIDENCE_DIR/controller-identities-before.json"

      - name: Acquire or renew the database maintenance fence and drain
        run: |
          set -Eeuo pipefail
          if NODE_ENV=production LODESTA_REPOSITORY=supabase npm run --silent maintenance:site-authoring -- renew --minutes=90 \
            > "$EVIDENCE_DIR/maintenance-renew.json" 2> "$EVIDENCE_DIR/maintenance-renew-error.txt"; then
            :
          else
            NODE_ENV=production LODESTA_REPOSITORY=supabase npm run --silent maintenance:site-authoring -- acquire --minutes=90 --draining \
              > "$EVIDENCE_DIR/maintenance-acquire.json"
          fi
          if ! NODE_ENV=production LODESTA_REPOSITORY=supabase npm run --silent maintenance:site-authoring -- wait-active --timeout-minutes=30 \
            > "$EVIDENCE_DIR/maintenance-drain.json"; then
            node --input-type=module -e '
              import { writeFileSync } from "node:fs";
              writeFileSync(process.argv[1], JSON.stringify({ ok: false, outcome: "authoring_drain_timeout" }, null, 2));
            ' "$EVIDENCE_DIR/authoring-drain-timeout.json"
            NODE_ENV=production LODESTA_REPOSITORY=supabase npm run --silent maintenance:site-authoring -- release \
              > "$EVIDENCE_DIR/maintenance-release-after-drain-timeout.json"
            exit 1
          fi
          touch "$EVIDENCE_DIR/maintenance-active"

      - name: Deploy web and worker from the same release
        id: controllers
        run: |
          set -Eeuo pipefail
          for pair in "$RAILWAY_WEB_SERVICE_ID:web" "$RAILWAY_WORKER_SERVICE_ID:site-authoring-worker"; do
            service="${pair%%:*}"
            role="${pair#*:}"
            railway variable set "LODESTA_RELEASE_GIT_SHA=$RELEASE_SHA" "LODESTA_EXECUTION_ROLE=$role" "LODESTA_REPOSITORY=supabase" --skip-deploys \
              --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --service "$service" > /dev/null
          done
          railway up --detach --json --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_WEB_SERVICE_ID" --message "Production web $RELEASE_SHA" \
            > "$EVIDENCE_DIR/railway-web-submit.json"
          railway up --detach --json --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_WORKER_SERVICE_ID" --message "Production worker $RELEASE_SHA" \
            > "$EVIDENCE_DIR/railway-worker-submit.json"
          for spec in "web:$RAILWAY_WEB_SERVICE_ID" "worker:$RAILWAY_WORKER_SERVICE_ID"; do
            name="${spec%%:*}"
            service="${spec#*:}"
            for attempt in $(seq 1 90); do
              railway deployment list --environment "$RAILWAY_ENVIRONMENT_ID" --service "$service" \
                --limit 20 --json > "$EVIDENCE_DIR/railway-$name-candidates.json"
              status="$(node --input-type=module -e '
                import { readFileSync, writeFileSync } from "node:fs";
                const priorIds = new Set(JSON.parse(readFileSync(process.argv[1], "utf8")).map((deployment) => deployment.id));
                const candidate = JSON.parse(readFileSync(process.argv[2], "utf8")).find((deployment) => !priorIds.has(deployment.id));
                if (candidate) writeFileSync(process.argv[3], JSON.stringify([candidate], null, 2));
                process.stdout.write(candidate?.status ?? "PENDING");
              ' "$EVIDENCE_DIR/railway-$name-before.json" "$EVIDENCE_DIR/railway-$name-candidates.json" "$EVIDENCE_DIR/railway-$name.json")"
              [ "$status" = "SUCCESS" ] && break
              case "$status" in FAILED|CRASHED|CANCELLED|CANCELED) exit 1;; esac
              [ "$attempt" -eq 90 ] && exit 1
              sleep 20
            done
          done
          web_deployment="$(node -p "JSON.parse(require('fs').readFileSync('$EVIDENCE_DIR/railway-web.json'))[0].id")"
          worker_deployment="$(node -p "JSON.parse(require('fs').readFileSync('$EVIDENCE_DIR/railway-worker.json'))[0].id")"
          echo "web_deployment=$web_deployment" >> "$GITHUB_OUTPUT"
          echo "worker_deployment=$worker_deployment" >> "$GITHUB_OUTPUT"

      - name: Verify both controller identities
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --header "authorization: Bearer $LODESTA_ADMIN_TOKEN" \
              "$LODESTA_APP_ORIGIN/api/health/?deep=1" > "$EVIDENCE_DIR/pre-promotion-health.json"; then
              node --input-type=module -e '
                import { readFileSync } from "node:fs";
                const report = JSON.parse(readFileSync(process.argv[1], "utf8"));
                const identity = report.checks?.find((check) => check.id === "release_identity");
                if (report.status === "error" || identity?.detail !== process.env.RELEASE_SHA) process.exit(1);
              ' "$EVIDENCE_DIR/pre-promotion-health.json" && break
            fi
            [ "$attempt" -eq 30 ] && exit 1
            sleep 10
          done
          for attempt in $(seq 1 30); do
            railway logs "${{ steps.controllers.outputs.worker_deployment }}" --service "$RAILWAY_WORKER_SERVICE_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" --project "$RAILWAY_PROJECT_ID" --lines 200 --json \
              > "$EVIDENCE_DIR/railway-worker-startup.jsonl"
            if grep -q 'worker_started' "$EVIDENCE_DIR/railway-worker-startup.jsonl" \
              && grep -q "$RELEASE_SHA" "$EVIDENCE_DIR/railway-worker-startup.jsonl"; then
              break
            fi
            [ "$attempt" -eq 30 ] && exit 1
            sleep 10
          done

      - name: Promote the registered sandbox and run deep health
        id: promotion
        run: |
          set -Eeuo pipefail
          NODE_ENV=production LODESTA_REPOSITORY=supabase npm run --silent sandbox:deployments -- promote \
            --deployment-id "${{ steps.sandbox.outputs.deployment }}" > "$EVIDENCE_DIR/sandbox-promotion.json"
          touch "$EVIDENCE_DIR/promoted"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --header "authorization: Bearer $LODESTA_ADMIN_TOKEN" \
              "$LODESTA_APP_ORIGIN/api/health/?deep=1" > "$EVIDENCE_DIR/post-promotion-health.json"; then
              node --input-type=module -e '
                import { readFileSync } from "node:fs";
                const report = JSON.parse(readFileSync(process.argv[1], "utf8"));
                const identity = report.checks?.find((check) => check.id === "release_identity");
                if (report.status === "error" || identity?.detail !== process.env.RELEASE_SHA) process.exit(1);
              ' "$EVIDENCE_DIR/post-promotion-health.json" && exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Release maintenance after successful health
        if: success()
        run: |
          set -Eeuo pipefail
          NODE_ENV=production LODESTA_REPOSITORY=supabase npm run --silent maintenance:site-authoring -- release \
            > "$EVIDENCE_DIR/maintenance-release.json"
          rm -f "$EVIDENCE_DIR/maintenance-active"

      - name: Restore only the sandbox pointer after post-promotion failure
        if: failure() && steps.promotion.outcome == 'failure'
        run: |
          set -Eeuo pipefail
          [ -f "$EVIDENCE_DIR/promoted" ] || exit 0
          NODE_ENV=production LODESTA_REPOSITORY=supabase npm run --silent sandbox:deployments -- rollback \
            --deployment-id "${{ steps.slot.outputs.previous_deployment }}" \
            > "$EVIDENCE_DIR/automatic-sandbox-rollback.json"
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            writeFileSync(process.argv[1], JSON.stringify({
              maintenanceActive: true,
              operatorWorkflow: "production-rollback.yml",
              priorSandboxDeploymentId: process.argv[2],
              priorControllerEvidence: "controller-identities-before.json"
            }, null, 2));
          ' "$EVIDENCE_DIR/operator-intervention.json" "${{ steps.slot.outputs.previous_deployment }}"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ env.RELEASE_SHA }}-${{ github.run_attempt }}
          path: .data/release-evidence/
          if-no-files-found: error
          retention-days: 90
