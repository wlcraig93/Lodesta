name: Production rollback

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact previous Git SHA to redeploy to Railway
        required: true
        type: string
      sandbox_deployment_id:
        description: Immutable blue or green deployment ID to reactivate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: production
    env:
      LODESTA_SANDBOX_BLUE_URL: ${{ vars.LODESTA_SANDBOX_BLUE_URL }}
      LODESTA_SANDBOX_BLUE_TOKEN: ${{ secrets.LODESTA_SANDBOX_BLUE_TOKEN }}
      LODESTA_SANDBOX_GREEN_URL: ${{ vars.LODESTA_SANDBOX_GREEN_URL }}
      LODESTA_SANDBOX_GREEN_TOKEN: ${{ secrets.LODESTA_SANDBOX_GREEN_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LODESTA_APP_ORIGIN: ${{ vars.LODESTA_APP_ORIGIN }}
      LODESTA_ADMIN_TOKEN: ${{ secrets.LODESTA_ADMIN_TOKEN }}
      EVIDENCE_DIR: .data/rollback-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global @railway/cli@5.28.1
      - name: Validate and reactivate the retained sandbox deployment
        run: |
          set -Eeuo pipefail
          [[ "${{ inputs.release_sha }}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${{ inputs.sandbox_deployment_id }}" =~ ^sandbox_deployment_[a-z0-9_]+$ ]]
          git cat-file -e "${{ inputs.release_sha }}^{commit}"
          mkdir -p "$EVIDENCE_DIR"
          npm run --silent sandbox:deployments -- rollback --deployment-id "${{ inputs.sandbox_deployment_id }}" \
            > "$EVIDENCE_DIR/sandbox-rollback.json"
      - name: Redeploy the retained controller
        run: |
          set -Eeuo pipefail
          git checkout --detach "${{ inputs.release_sha }}"
          npm ci
          railway variable set "LODESTA_RELEASE_GIT_SHA=${{ inputs.release_sha }}" --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --service "$RAILWAY_SERVICE_ID" > /dev/null
          railway up --ci --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" --message "Approved rollback to ${{ inputs.release_sha }}"
          for attempt in $(seq 1 90); do
            railway deployment list --environment "$RAILWAY_ENVIRONMENT_ID" --service "$RAILWAY_SERVICE_ID" \
              --limit 1 --json > "$EVIDENCE_DIR/railway.json"
            status="$(node -p "JSON.parse(require('fs').readFileSync('$EVIDENCE_DIR/railway.json'))[0]?.status ?? 'UNKNOWN'")"
            [ "$status" = "SUCCESS" ] && break
            case "$status" in FAILED|CRASHED|CANCELLED|CANCELED) exit 1;; esac
            [ "$attempt" -eq 90 ] && exit 1
            sleep 20
          done
          curl --fail --silent --show-error --header "authorization: Bearer $LODESTA_ADMIN_TOKEN" \
            "$LODESTA_APP_ORIGIN/api/health?deep=1" > "$EVIDENCE_DIR/deep-health.json"
      - name: Upload rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-rollback-${{ inputs.release_sha }}-${{ github.run_attempt }}
          path: .data/rollback-evidence/
          if-no-files-found: error
          retention-days: 90
